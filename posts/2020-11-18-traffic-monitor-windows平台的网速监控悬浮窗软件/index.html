    <p style="color:#888;">2020-11-18</p>
    <p><a href="https://github.com/zhongyang219/TrafficMonitor">Traffic Monitor</a>是一款用于Windows平台的网速监控悬浮窗软件，可以显示当前网速、CPU及内存利用率，支持嵌入到任务栏显示，支持更换皮肤、历史流量统计等功能。</p>
<h3>主要特性</h3>
<div class="codehilite"><pre><span></span><code>- 显示当前实现网络传输速率、CPU和内存占用率

- 如果电脑有多个网卡，支持自动和手动选择网络连接

- 查看网络详细信息

- 支持嵌入到任务栏显示

- 支持更换皮肤和自定义皮肤

- 历史流量统计
</code></pre></div>
