<p style="color:#888;">2022-01-23</p>
    <p>重新定位仅用于服务器 IP 地址更改、通讯协议（例如：http:// 改为 https://）更改或者服务器设置更改所导致的资源库根路径更改。</p>
<h3><strong>1. 打开svn资源库面板</strong></h3>
<p>工具栏 — Window — Show View — Other
<a href="/images/Pasted-image-20220123144743.png"><img alt="" src="/images/Pasted-image-20220123144743.png" /></a>
打开 SVN资源库
<a href="/images/Pasted-image-20220123145047.png"><img alt="" src="/images/Pasted-image-20220123145047.png" /></a></p>
<h3><strong>2. 重新定位</strong></h3>
<p>右键点击svn地址，选择 重新定位...
<a href="/images/Pasted-image-20220123145209.png"><img alt="" src="/images/Pasted-image-20220123145209.png" /></a>
选择项目，下一步（next）
<a href="/images/Pasted-image-20220123145520.png"><img alt="" src="/images/Pasted-image-20220123145520.png" /></a>
更换svn地址后，点击finish，稍等即可
<a href="/images/Pasted-image-20220123145540.png"><img alt="" src="/images/Pasted-image-20220123145540.png" /></a></p>
