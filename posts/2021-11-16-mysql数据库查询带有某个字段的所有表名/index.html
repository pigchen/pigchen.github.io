<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mysql数据库查询带有某个字段的所有表名 - pigchen</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.8; color: #333; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        img { max-width: 100%; height: auto; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
        code { background: #f0f0f0; padding: 2px 5px; border-radius: 3px; }
        pre code { background: none; padding: 0; }
        a { color: #007bff; }
        .back { margin-top: 30px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>

<body>
    <h1>mysql数据库查询带有某个字段的所有表名</h1>
    <p style="color:#888;">2021-11-16</p>
    <p>mysql数据库查询带有某个字段的所有表名</p>
<p>SELECT TABLE_NAME,COLUMN_COMMENT FROM information_schema.columns WHERE COLUMN_NAME='COLUMN_NAME' AND TABLE_SCHEMA = "database";</p>
<p>COLUMN_NAME：需要查询的字段
database：查询的数据库</p>
