    <p>查询mysql数据库中所有表</p>
<h3><strong>包含视图：</strong></h3>
<p><code>SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA = '数据库名';</code></p>
<h3><strong>不包含视图：</strong></h3>
<p><code>SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA = '数据库名' AND TABLE_TYPE = 'BASE TABLE';</code></p>
